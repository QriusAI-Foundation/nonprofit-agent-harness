name: Bug report
description: Something does not work the way the documentation says it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        The smallest thing that shows the problem. If you can reproduce it with the
        offline provider, that is ideal, because then nobody needs credentials to
        look into it.
      placeholder: |
        harness run examples.summarizer:SummarizerAgent report.txt
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release, or commit hash if you are running from a clone.
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: ["echo (offline)", "google (Vertex AI)", "google (Gemini API)", "custom"]
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: Storage
      options: ["memory", "gcp", "custom"]
    validations:
      required: true

  - type: textarea
    id: config-check
    attributes:
      label: Output of `harness check`
      description: >-
        This prints the settings in force and any warnings. Redact anything you
        consider sensitive, though it is written not to print secret values.
      render: text
