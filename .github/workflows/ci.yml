name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev,documents]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  offline:
    # The quickstart promises a clone runs with no cloud account, no API key, and no
    # optional extras. This job is what keeps that promise true.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: harness check
      - run: |
          echo "A short programme brief for testing." > brief.txt
          harness run examples.summarizer:SummarizerAgent brief.txt
