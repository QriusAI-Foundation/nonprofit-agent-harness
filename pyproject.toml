[project]
name = "nonprofit-agent-harness"
version = "0.1.0"
description = "An open agent harness for the nonprofit sector: review gates, budget ceilings, readiness scoring, and a pluggable model layer. Built on Google's ADK, usable without it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "QriusAI Foundation", email = "sanmaya@qriusai.org" }]
keywords = ["agents", "nonprofit", "adk", "llm", "harness", "ngo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
adk = [
    "google-adk>=1.8",
    "google-genai>=0.8",
]
gcp = [
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "google-cloud-secret-manager>=2.20",
    "google-auth>=2.35",
]
documents = [
    "pypdf>=5.0",
    "python-docx>=1.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.11",
]
all = [
    "nonprofit-agent-harness[adk,gcp,documents]",
]

[project.urls]
Homepage = "https://qriusai.org/"
Repository = "https://github.com/QriusAI-Foundation/nonprofit-agent-harness"
Issues = "https://github.com/QriusAI-Foundation/nonprofit-agent-harness/issues"

[project.scripts]
harness = "nonprofit_harness.cli:main"

# Makes this repo usable as an agent-starter-pack remote template:
#   agent-starter-pack create my-agent -a github.com/QriusAI-Foundation/nonprofit-agent-harness
[tool.agent-starter-pack]
base_template = "adk"
name = "Nonprofit Agent Harness"
description = "Agent scaffold for the nonprofit sector: human review gates, per-run budget ceilings, and AI-readiness scoring."
example_question = "Turn this training PDF into a facilitator guide, and hold it for human review before release."

[tool.agent-starter-pack.settings]
deployment_targets = ["cloud_run"]
agent_directory = "examples"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nonprofit_harness = ["readiness/instruments/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 forbids function calls in argument defaults, which is exactly how FastAPI
# declares dependencies. Fighting it would mean writing worse FastAPI.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
